<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TDS STRATEGIST - Mini App</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0B0C10;
        color: #C5C6C7;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        position: fixed;
        width: 100vw;
        height: 100vh;
      }
      #tma-app {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 50% 100%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
      }
      .tma-header {
        padding: 1rem;
        text-align: center;
        background: rgba(11, 12, 16, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(16, 185, 129, 0.3);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        z-index: 10;
      }
      .tma-header h2 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: #10B981;
        text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
      }
      .tma-content {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        padding-bottom: 2rem;
      }

      .tma-content::-webkit-scrollbar {
        width: 6px;
      }
      .tma-content::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
      }
      .tma-content::-webkit-scrollbar-thumb {
        background: rgba(16, 185, 129, 0.3);
        border-radius: 10px;
      }

      .filter-group select, input[type="text"] {
        width: 100%;
        padding: 12px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #fff;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s;
        margin-bottom: 1rem;
      }

      .filter-group select:focus, input[type="text"]:focus {
        border-color: #8B5CF6;
        box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
      }

      .preset-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 1rem;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: transform 0.2s, border-color 0.2s;
      }

      .preset-card:active {
        transform: scale(0.98);
        border-color: rgba(16, 185, 129, 0.5);
      }

      .preset-info {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .preset-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: rgba(0,0,0,0.5);
      }

      .preset-details h3 {
        margin: 0 0 4px 0;
        font-size: 1.1rem;
        color: #fff;
      }

      .preset-details p {
        margin: 0;
        font-size: 0.85rem;
        color: #8B5CF6;
      }

      button.primary-btn {
        width: 100%;
        padding: 12px;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 8px;
        color: #10B981;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      button.primary-btn:active {
        background: rgba(16, 185, 129, 0.2);
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
      }
    </style>

  </head>
  <body>
    <div id="tma-app">
      <div class="tma-header">
        <h2 style="margin:0; font-size:1.2rem;">Catalog</h2>
      </div>

      <div class="tma-content">
        <div class="filter-group">
          <select id="tma-filter-mode">
            <option value="All">All Modes</option>
            <option value="Easy">Easy</option>
            <option value="Fallen">Fallen</option>
            <option value="Hardcore">Hardcore</option>
            <!-- Add others -->
          </select>
        </div>

        <div id="tma-presets-list" class="presets-list">
          <p>Loading presets...</p>
        </div>
      </div>

      <!-- Session Input for Desktop Sync -->
      <div style="padding: 0 1rem; margin-bottom: 1rem;">
        <label style="font-size: 0.8rem; color: var(--text-secondary);">Target Desktop Session ID (Optional):</label>
        <input type="text" id="target-session-id" placeholder="e.g. 123456" style="width: 100%; margin-top: 0.5rem;" />
      </div>
    </div>

    <script type="module">
      const tg = window.Telegram.WebApp;
      tg.expand();

      const API_URL = import.meta.env?.VITE_API_URL || 'https://tds-utils.onrender.com';
      const tmaPresetsList = document.getElementById('tma-presets-list');
      const tmaFilterMode = document.getElementById('tma-filter-mode');
      const targetSessionIdIn = document.getElementById('target-session-id');

      // Auto-auth
      let user = null;
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        user = tg.initDataUnsafe.user;
        console.log("Logged in as:", user.username);
        // We could send initData to backend to verify and mint a token.
      }

      const MODE_ICONS = {
        "Easy": "https://static.wikia.nocookie.net/tower-defense-sim/images/8/87/EasyReworkIcon.png",
        "Casual": "https://static.wikia.nocookie.net/tower-defense-sim/images/0/02/GraveDiggerEasyIcon.png",
        "Intermediate": "https://static.wikia.nocookie.net/tower-defense-sim/images/9/96/PatientZeroIntermediateIcon.png",
        "Molten": "https://static.wikia.nocookie.net/tower-defense-sim/images/7/7f/MoltenBossMoltenIcon.png",
        "Fallen": "https://static.wikia.nocookie.net/tower-defense-sim/images/1/1c/FallenReworkIcon.png",
        "Frost": "https://static.wikia.nocookie.net/tower-defense-sim/images/e/ec/FrostModeIcon.png",
        "Hardcore": "https://static.wikia.nocookie.net/tower-defense-sim/images/d/dd/Hardcore2026Icon.png",
        "Voidcore": "https://static.wikia.nocookie.net/tower-defense-sim/images/9/94/VoidcoreIcon.png",
        "Pizza Party": "https://static.wikia.nocookie.net/tower-defense-sim/images/9/96/PizzaPartyIconNew.png",
        "Badlands II": "https://static.wikia.nocookie.net/tower-defense-sim/images/7/78/BadlandsIIIconNew.png",
        "Polluted Wasteland II": "https://static.wikia.nocookie.net/tower-defense-sim/images/b/bd/PollutedWastelandIIIconNew.png"
      };

      async function fetchPresets() {
        tmaPresetsList.innerHTML = '<p>Loading...</p>';
        try {
          const res = await fetch(`${API_URL}/api/presets?mode=${tmaFilterMode.value}`);
          if (!res.ok) throw new Error('Failed');
          const presets = await res.json();

          tmaPresetsList.innerHTML = '';
          if (presets.length === 0) {
            tmaPresetsList.innerHTML = '<p>No presets found.</p>';
            return;
          }

          presets.forEach(p => {
            const iconUrl = MODE_ICONS[p.mode] || MODE_ICONS["Easy"];
            const card = document.createElement('div');
            card.className = 'preset-card';
            card.innerHTML = `
              <div class="preset-info">
                <img src="${iconUrl}" class="preset-icon" />
                <div class="preset-details">
                  <h3 class="safe-title"></h3>
                  <p>${p.mode} | ${p.players}P</p>
                </div>
              </div>
              <button class="primary-btn" style="margin-top:0.5rem;" onclick="applyToCalculator(${p.id})">🎮 Apply to Web</button>
            `;
            card.querySelector('.safe-title').textContent = p.title;
            tmaPresetsList.appendChild(card);
          });
        } catch (err) {
          tmaPresetsList.innerHTML = '<p>Error.</p>';
        }
      }

      tmaFilterMode.onchange = fetchPresets;
      fetchPresets();

      window.applyToCalculator = async (presetId) => {
        const sid = targetSessionIdIn.value.trim();
        let payload = { preset_id: presetId };

        // If user typed a session ID, send to that session.
        if (sid) {
          payload.target_session = sid;
        } else if (user && user.id) {
          // Otherwise rely on backend knowing user's linked session via bot
          payload.telegram_user_id = user.id;
        } else {
          tg.showAlert("Please enter a Desktop Session ID or ensure you started the bot with your session link.");
          return;
        }

        try {
          const res = await fetch(`${API_URL}/api/tma/apply`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.success) {
            tg.showAlert("Successfully applied to your calculator!");
          } else {
            tg.showAlert("Error: " + (data.error || "Session not found"));
          }
        } catch (e) {
          tg.showAlert("Network error.");
        }
      };
    </script>
  </body>
</html>
